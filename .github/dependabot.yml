version: 2
updates:
  # Target the fresh-build branch, the repo's default, so bump PRs are based on current code.
  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: "fresh-build"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "fresh-build"
    schedule:
      interval: "weekly"
